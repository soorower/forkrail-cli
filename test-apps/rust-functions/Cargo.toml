[package]
name = "rust-functions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vercel_runtime = "2.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

# Each function is a [[bin]], as Vercel's Rust runtime needs.
[[bin]]
name = "hello"
path = "api/hello.rs"

[[bin]]
name = "user"
path = "api/users/[id].rs"

[profile.release]
strip = true

# Its own workspace: it sits inside forkrail's.
[workspace]
