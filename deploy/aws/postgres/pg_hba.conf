# Who may connect to forkrail's Postgres (deploy/aws/postgres/install.sh replaces the whole file).
# The box's security group decides which addresses reach port 5432 at all: the routers, through
# which the dashboard connects.

# On the box itself: the postgres user, for setup, backups and restores.
local    all        postgres                       peer

# The dashboard: its own database, over TLS, by password (SCRAM). Nothing else is let in.
hostssl  forkrail   forkrail_web   0.0.0.0/0       scram-sha-256
