# forkrail's Postgres settings (deploy/aws/postgres/install.sh puts this in the data folder's conf.d).
# The database is small (people, teams, members, sessions), and it shares a 4 GB box with ClickHouse.
listen_addresses = '*'
port = 5432
max_connections = 60
shared_buffers = 128MB

# Every connection from outside the box is TLS (pg_hba.conf), with the box's own certificate.
ssl = on
ssl_cert_file = '/var/lib/pgsql/tls/cert.pem'
ssl_key_file = '/var/lib/pgsql/tls/key.pem'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# A worker's connections end without a goodbye when its router restarts or the box across the
# internet goes quiet: notice within a couple of minutes, and close what sits unused.
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 3
idle_session_timeout = '15min'

log_min_duration_statement = '1s'
