AWSTemplateFormatVersion: "2010-09-09"
# The key that encrypts every project's env var values: the SSM parameters holding them (in the
# home region) and the Lambda functions' environments (in every region with functions). Apply it in
# each such region:
#
#   deploy/aws/stack.sh apply secrets
#   AWS_REGION=us-west-1 deploy/aws/stack.sh apply secrets
#
# A value can be read only by a principal that IAM gives kms:Decrypt on this key: forkrail's admin
# CLI and the control function do; the routers' role doesn't. The routers face the internet, so the
# key itself also refuses them and the analytics box, whatever IAM says later.
#
# The dashboard's own secrets (its database password, GitHub's client and webhook secrets) are SSM
# parameters under /forkrail/web/ encrypted with this key too. The dashboard's role may decrypt
# those alone: its IAM policy (deploy/aws/dashboard.sh) allows kms:Decrypt only through SSM and only
# where the encryption context names a /forkrail/web/ parameter, so it can't decrypt a project's
# env var value or a function's environment.
#
# Losing the key loses every value, so it's retained when the stack is deleted or replaced.
Description: forkrail's KMS key for env var values (SSM parameters and Lambda environments) and the dashboard's own secrets; the routers' and the analytics box's roles can never decrypt with it.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Resources:
  EnvKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: forkrail env var values
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account's IAM policies decide who uses the key, as for any key with a default policy.
          - Sid: AccountUsesIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          # Except the routers, the analytics box, and the roles that run code forkrail didn't write
          # but never need a value themselves (a build gets its order through a URL the control
          # function signs; the screenshot function opens pages): an explicit deny here wins over
          # any allow in IAM or a grant. Apps' functions (forkrail-worker) decrypt their own
          # environment through Lambda's grant, so they can't be refused here.
          - Sid: NeverDecrypt
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
              - kms:CreateGrant
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-router
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-analytics
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-builder
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-screenshot
    Metadata:
      com.aws.cloudformation.Context:
        why: One key for every secret forkrail keeps, so reading one takes IAM's say-so and never just SSM access.
        must: Keep the deny on the routers', the analytics box's, the builder's and the screenshot function's roles. Any role given kms:Decrypt on this key for /forkrail/web/ parameters must be limited by kms:EncryptionContext:PARAMETER_ARN.

  EnvKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/forkrail-env
      TargetKeyId: !Ref EnvKey

Outputs:
  KeyArn:
    Value: !GetAtt EnvKey.Arn
