AWSTemplateFormatVersion: "2010-09-09"
# The dashboard's own table: people, their ways of signing in, the team and its members, browser
# sessions, terminals signed in with `forkrail login` and the logins on their way there, and the
# audit trail of changes to all of these (web/src/server/accounts.ts, tokens.ts, web-table.ts).
# Apply it in the home region:
#
#   deploy/aws/stack.sh apply web AdminPrincipals=arn:aws:iam::<account>:root,<admin role ARN>
#
# In the policy's conditions the root's ARN is the root user alone: an administrator signed in
# through a role (SSO, assumed) or as an IAM user is named by that role's ARN (path and all) or
# the user's, as `forkrail install` passes the one that runs it.
#
# Signing in to the dashboard depends on this table and nothing else of forkrail's: not the
# analytics box (logs and metrics stay there), not the routers' network. Apps keep serving
# whatever happens to it.
#
# Who can reach the items: the dashboard (reads and writes them, item by item) and the install's
# administrators (AdminPrincipals). The table's resource policy refuses every data action to anyone
# else, whatever their own IAM policies allow: the control function, the shared worker role apps
# run as, a project's own role, the routers, the builder, the analytics box, other workloads in the
# account. It refuses only data actions, so any administrator can still change the policy itself.
#
# Only hashes of session tokens, terminal tokens and login secrets are stored: a copy of the table
# (a backup, an export) signs nobody in.
#
# Losing the table signs everyone out and loses the team's members, so it's retained when the
# stack is deleted or replaced, it can't be deleted while deletion protection is on, and it can be
# restored to any second of the last 35 days.
Description: forkrail dashboard's table (people, the team, members, sessions, terminal tokens, audit) and its KMS key; only the dashboard and the install's administrators can reach the items.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  AdminPrincipals:
    Type: CommaDelimitedList
    Description: The IAM principals (ARNs) that administer the install with the CLI's AWS credentials, which may read and write the table and restore it. The root user is arn:aws:iam::<account>:root, which here is the root user alone; a role's ARN (with its path) for administrators who sign in through one.
  DashboardRole:
    Type: String
    Default: forkrail-dashboard
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
  NotifyRole:
    Type: String
    Default: forkrail-notify
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
    Description: The notifier's role (deploy/install/notify.yaml), which reads members and preferences and writes notifications.
  AlertsTopic:
    Type: String
    Default: forkrail-alerts
    Description: The SNS topic forkrail's alarms notify (deploy/aws/test-env.sh monitor makes it).

Resources:
  WebKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: forkrail dashboard table
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account's IAM policies decide who uses the key, as for any key with a default policy.
          - Sid: AccountUsesIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          # The roles that face the internet or run other people's code never use it, whatever IAM
          # says later.
          - Sid: NeverTheseRoles
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey*
              - kms:ReEncrypt*
              - kms:CreateGrant
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-router
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-analytics
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-worker
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-builder
      Tags:
        - Key: project
          Value: forkrail

  WebKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/forkrail-web
      TargetKeyId: !Ref WebKey

  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: forkrail-web
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: uid
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # A person's sessions and terminals (only those items carry `uid`), to list and end them.
        - IndexName: by-user
          KeySchema:
            - AttributeName: uid
              KeyType: HASH
            - AttributeName: pk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # Sessions, terminals, logins under way and their limits carry `ttl` (seconds): DynamoDB
      # deletes them some time after. Reads check their own expiry, so the delay doesn't matter.
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 35
      DeletionProtectionEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt WebKey.Arn
      ResourcePolicy:
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            # Nobody but the dashboard and the administrators reads, writes, exports, backs up or
            # restores the items.
            - Sid: OnlyDashboardAndAdministrators
              Effect: Deny
              Principal: "*"
              Action:
                - dynamodb:GetItem
                - dynamodb:BatchGetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:BatchWriteItem
                - dynamodb:ConditionCheckItem
                - dynamodb:PartiQLSelect
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
                - dynamodb:PartiQLDelete
                - dynamodb:ExportTableToPointInTime
                - dynamodb:RestoreTableToPointInTime
                - dynamodb:CreateBackup
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/forkrail-web
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/forkrail-web/index/*
              Condition:
                ArnNotLike:
                  aws:PrincipalArn: !Split
                    - ","
                    - !Join
                      - ","
                      - - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DashboardRole}
                        # The notifier (deploy/install/notify.yaml): its own role keeps it to
                        # members, preferences, notifications and webhooks.
                        - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${NotifyRole}
                        - !Join [",", !Ref AdminPrincipals]
            # The dashboard reads and writes items one by one and queries; it never scans, exports,
            # backs up or restores.
            - Sid: DashboardOnlyItems
              Effect: Deny
              Principal: "*"
              Action:
                - dynamodb:Scan
                - dynamodb:PartiQLSelect
                - dynamodb:PartiQLInsert
                - dynamodb:PartiQLUpdate
                - dynamodb:PartiQLDelete
                - dynamodb:ExportTableToPointInTime
                - dynamodb:RestoreTableToPointInTime
                - dynamodb:CreateBackup
              Resource:
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/forkrail-web
                - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/forkrail-web/index/*
              Condition:
                ArnLike:
                  aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DashboardRole}
      Tags:
        - Key: project
          Value: forkrail
    Metadata:
      com.aws.cloudformation.Context:
        why: The dashboard's people, team, members, sessions and terminal tokens, read and written by key with transactions, reachable by the dashboard and the administrators only.
        must: Keep the resource policy's deny on everyone else and the dashboard's items-only deny. Never give the routers, the builder, the worker role, the control function or the analytics box rights here; the notifier (forkrail-notify) gets in, kept by its own role to members, preferences, notifications and webhooks. Keep deletion protection and point-in-time recovery on.

  # DynamoDB failing on its side: nobody can sign in to the dashboard.
  SystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: forkrail-web-errors
      AlarmDescription: DynamoDB answers forkrail-web's requests with errors on its side; signing in to the dashboard fails.
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref Table
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopic}
      OKActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopic}

Outputs:
  TableName:
    Value: !Ref Table
  TableArn:
    Value: !GetAtt Table.Arn
  KeyArn:
    Value: !GetAtt WebKey.Arn
