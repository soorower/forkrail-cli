AWSTemplateFormatVersion: "2010-09-09"
# The key that encrypts the install's own secrets in SSM, in the home region: the routers' Cloudflare
# token and challenge key, and the ClickHouse passwords (ingest, reader, buildlog). Apply it once,
# then move the parameters under it:
#
#   deploy/aws/stack.sh apply install-secrets
#   deploy/aws/install-secrets.sh move
#
# Each reader's IAM policy allows kms:Decrypt on this key only through SSM and only where the
# encryption context names one of its own parameters (SSM sets PARAMETER_ARN): the routers
# (deploy/aws/test-env.sh), the analytics box (deploy/aws/analytics.sh) and the dashboard
# (deploy/aws/dashboard.sh). Project env var values have a key of their own (secrets.yaml).
#
# Losing the key loses those secrets (each can be made again), so it's retained all the same.
Description: forkrail's KMS key for the install's own secrets in SSM (the Cloudflare token, the challenge key, ClickHouse passwords); code that runs apps or builds can never decrypt with it.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Resources:
  InstallKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: forkrail install secrets
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account's IAM policies decide who uses the key, as for any key with a default policy.
          - Sid: AccountUsesIamPolicies
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          # Roles that run code forkrail didn't write (apps, builds, pages it screenshots), and the
          # control function, which needs none of these: refused whatever IAM says later.
          - Sid: NeverDecrypt
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Decrypt
              - kms:ReEncryptFrom
              - kms:CreateGrant
            Resource: "*"
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-worker
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-builder
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-screenshot
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/forkrail-control
    Metadata:
      com.aws.cloudformation.Context:
        why: The install's own secrets under a key of forkrail's, so reading one takes IAM's say-so for that parameter, never just SSM access (AWS's own SSM key lets anyone in the account decrypt through SSM).
        must: Keep the deny. Any role given kms:Decrypt on this key must be limited to kms:ViaService ssm and to its own parameters by kms:EncryptionContext:PARAMETER_ARN.

  InstallKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/forkrail-install
      TargetKeyId: !Ref InstallKey

Outputs:
  KeyArn:
    Value: !GetAtt InstallKey.Arn
