[package]
name = "forkrail-common"
version = "0.1.0"
edition = "2024"

[features]
# Routing rules (rules/): the CLI and the router, not the runtime in every Lambda package.
rules = ["dep:regex", "dep:fancy-regex", "dep:sha2"]
# Custom domains' ACME delegation names (routes::acme_delegation): the CLI and the router.
domains = ["dep:sha2"]
# Sealed env files (envfile.rs): the CLI seals them, the runtime opens them.
envfile = ["dep:ring"]
# Image Optimization's settings and checks (images.rs): the CLI and the router.
images = ["dep:regex", "dep:fancy-regex", "dep:sha2", "dep:url"]

[dependencies]
fancy-regex = { version = "0.16", optional = true }
regex = { version = "1.11", optional = true }
ring = { version = "0.17.14", optional = true }
bytes = "1.12.1"
getrandom = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
pin-project-lite = "0.2.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", optional = true }
tokio = { version = "1.54.1", features = ["io-util", "sync", "time"] }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "test-util", "io-util"] }
