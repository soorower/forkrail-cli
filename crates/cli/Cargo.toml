[package]
name = "forkrail-cli"
version = "0.1.3"
edition = "2024"

[[bin]]
name = "forkrail"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["credentials-login"] }
aws-sdk-cloudformation = "1.142.0"
aws-sdk-cloudwatchlogs = "1.166.0"
aws-sdk-dynamodb = "1.139.0"
aws-sdk-ec2 = "1.283.0"
aws-sdk-ecr = "1.142.0"
aws-sdk-iam = "1.139.0"
aws-sdk-kms = "1.131.0"
aws-sdk-lambda = "1.156.0"
aws-sdk-s3 = "1.157.0"
aws-sdk-scheduler = "1.122.0"
aws-sdk-servicequotas = "1.124.0"
aws-sdk-sns = "1.124.0"
aws-sdk-sqs = "1.121.0"
aws-sdk-ssm = "1.134.0"
aws-sdk-sts = "1.124.0"
base64 = "0.23.1"
brotli = "9.1.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# Next's middleware matchers are JavaScript patterns, with look-ahead (next.rs).
fancy-regex = "0.16"
flate2 = "1.1.11"
forkrail-common = { version = "0.1.0", path = "../common", features = ["rules", "domains", "envfile", "images"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
ignore = "0.4.34"
# The registered domain of a custom domain (domains.rs), for its DNS records.
psl = "2.1.253"
ring = "0.17.14"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "net", "sync", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.14.3", default-features = false, features = ["zstdmt"] }

[dev-dependencies]
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
tokio = { version = "1.54.1", features = ["test-util"] }
