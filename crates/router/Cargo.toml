[package]
name = "forkrail-router"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9"
aws-config = "1.13.0"
aws-sdk-lambda = "1.156.0"
aws-sdk-s3 = "1.157.0"
aws-sdk-ssm = "1.133.0"
# Deployment protection's tokens: base64url parts, Ed25519 signatures (protection.rs).
base64 = "0.22.1"
bytes = "1.12.1"
# Batches of app logs to ClickHouse in another region are compressed (sink.rs).
flate2 = "1.1.11"
forkrail-common = { version = "0.1.0", path = "../common", features = ["rules", "domains", "images"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server", "client"] }
# Only to tell a reset stream from a dead tunnel in hyper's errors; the version hyper uses.
h2 = "0.4.21"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "tls12", "rustls-platform-verifier"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "server-graceful", "http1", "http2", "client-legacy"] }
# Rewrites elsewhere resolve names through a resolver of their own that keeps public addresses (proxy.rs).
tower-service = "0.3.3"
# The kernel's byte counts for a worker's tunnel (wire.rs).
libc = "0.2.191"
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = "0.14.10"
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
socket2 = { version = "0.6", features = ["all"] }
maxminddb = { version = "0.32", default-features = false, features = ["mmap"] }
memmap2 = "0.9"
aws-sdk-sqs = "1.121.0"
