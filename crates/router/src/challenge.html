<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Checking your browser</title>
<style>
:root { --bg: #fafafa; --card: #ffffff; --text: #171717; --muted: #646464; --line: #e5e5e5; --accent: #5b5bd6; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a0a0b; --card: #141416; --text: #ededed; --muted: #a1a1a1; --line: #262629; --accent: #9b9ef0; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 32px 28px 24px; }
h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; }
p { margin: 0 0 16px; color: var(--muted); }
.host { color: var(--text); font-weight: 500; overflow-wrap: anywhere; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 35%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: .5; } }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.error { color: #d93036; }
footer { margin-top: 20px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1><span class="spin" id="spin"></span><span id="title">Checking your browser</span></h1>
  <p id="text">Making sure you're a person before going on to <span class="host">{{HOST}}</span>. This takes a moment.</p>
  <div class="bar" id="bar"><span></span></div>
  <noscript><p class="error" style="margin-top:16px">Turn on JavaScript to continue to {{HOST}}.</p></noscript>
  <footer>Protected by forkrail</footer>
</main>
<script>
(function () {
  var seed = "{{SEED}}";
  var bits = {{BITS}};

  // The first number from `start`, of `count`, whose SHA-256 with the seed starts with `bits` zero
  // bits; -1 if none. Self-contained, so a worker can run it too. SHA-256 over one 64-byte block:
  // seed and number together stay under 56 bytes.
  function pow(seed, bits, start, count) {
    var K = new Int32Array([
      0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
      0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
      0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
      0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
      0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
      0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
      0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
      0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
    ]);
    var block = new Uint8Array(64), W = new Int32Array(64), shift = 32 - bits;
    for (var i = 0; i < seed.length; i++) block[i] = seed.charCodeAt(i);
    for (var n = start; n < start + count; n++) {
      var s = "" + n, len = seed.length + s.length, j, t;
      for (j = 0; j < s.length; j++) block[seed.length + j] = s.charCodeAt(j);
      block[len] = 0x80;
      for (j = len + 1; j < 62; j++) block[j] = 0;
      block[62] = (len * 8) >>> 8; block[63] = (len * 8) & 255;
      for (t = 0; t < 16; t++) W[t] = block[4 * t] << 24 | block[4 * t + 1] << 16 | block[4 * t + 2] << 8 | block[4 * t + 3];
      for (t = 16; t < 64; t++) {
        var x = W[t - 15], y = W[t - 2];
        W[t] = (W[t - 16] + ((x >>> 7 | x << 25) ^ (x >>> 18 | x << 14) ^ (x >>> 3)) + W[t - 7] + ((y >>> 17 | y << 15) ^ (y >>> 19 | y << 13) ^ (y >>> 10))) | 0;
      }
      var a = 0x6a09e667, b = 0xbb67ae85 | 0, c = 0x3c6ef372, d = 0xa54ff53a | 0, e = 0x510e527f, f = 0x9b05688c | 0, g = 0x1f83d9ab, h = 0x5be0cd19;
      for (t = 0; t < 64; t++) {
        var t1 = (h + ((e >>> 6 | e << 26) ^ (e >>> 11 | e << 21) ^ (e >>> 25 | e << 7)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
        var t2 = (((a >>> 2 | a << 30) ^ (a >>> 13 | a << 19) ^ (a >>> 22 | a << 10)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      if ((((a + 0x6a09e667) | 0) >>> shift) === 0) return n;
    }
    return -1;
  }

  function fail() {
    document.getElementById("spin").style.display = "none";
    document.getElementById("bar").style.display = "none";
    document.getElementById("title").textContent = "Something went wrong";
    var p = document.getElementById("text");
    p.className = "error";
    p.textContent = "The check didn't finish. Reload the page to try again.";
  }

  function send(nonce) {
    var body = "seed=" + encodeURIComponent(seed) + "&nonce=" + nonce;
    fetch("{{PATH}}", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/x-www-form-urlencoded" }, body: body })
      .then(function (r) { if (r.status === 204) location.reload(); else fail(); }, fail);
  }

  // In a worker: a background tab slows the page's own timers to about one a second, not a
  // worker. Without workers, in steps on the page.
  try {
    var source = pow.toString() + "\nonmessage = function (m) { for (var n = 0; ; n += 1000000) { var r = pow(m.data[0], m.data[1], n, 1000000); if (r >= 0) { postMessage(r); return; } } };";
    var worker = new Worker(URL.createObjectURL(new Blob([source], { type: "text/javascript" })));
    worker.onmessage = function (m) { send(m.data); };
    worker.onerror = function (e) { e.preventDefault(); inPage(); };
    worker.postMessage([seed, bits]);
  } catch (e) {
    inPage();
  }

  function inPage() {
    var n = 0;
    (function step() {
      var r = pow(seed, bits, n, 40000);
      if (r >= 0) return send(r);
      n += 40000;
      setTimeout(step, 0);
    })();
  }
})();
</script>
</body>
</html>
