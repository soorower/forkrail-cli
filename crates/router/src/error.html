<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>@STATUS@: @TITLE@</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#171717;--muted:#737373;--line:#e5e5e5;--chip:#f5f5f5}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#ededed;--muted:#a1a1a1;--line:#262626;--chip:#171717}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px}
.icon i{display:block;width:4px;height:14px;border-radius:2px;background:var(--fg)}
.icon b{font-size:18px;font-weight:600;line-height:1}
h1{display:flex;align-items:center;gap:16px;margin:0;font-size:16px;font-weight:500;letter-spacing:-.01em;text-wrap:balance}
h1 b{font-size:22px;font-weight:600;padding-right:16px;border-right:1px solid var(--line)}
@media (max-width:480px){h1{flex-direction:column;gap:8px}h1 b{border:0;padding:0}}
code{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
</style>
</head>
<body>
<main>
<div class="icon" aria-hidden="true">@ICON@</div>
<h1><b>@STATUS@</b>@MESSAGE@</h1>
<code>@CODE@ · @ID@</code>
</main>
</body>
</html>
