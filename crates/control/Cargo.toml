[package]
name = "forkrail-control"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "forkrail-control"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = "1.13.0"
forkrail-cli = { version = "0.1.0", path = "../cli" }
forkrail-common = { version = "0.1.0", path = "../common" }
lambda_runtime = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
