[package]
name = "forkrail-builder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "forkrail-builder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
forkrail-cli = { version = "0.1.0", path = "../cli" }
lambda_runtime = "1.5.0"
libc = "0.2.191"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
