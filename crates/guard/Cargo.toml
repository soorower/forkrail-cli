[package]
name = "forkrail-guard"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "forkrail-guard"
path = "src/main.rs"

[features]
# Run on a workstation with an `aws login` profile (`cargo run -p forkrail-guard --features local`).
local = ["aws-config/credentials-login"]

[dependencies]
anyhow = "1.0.104"
aws-config = "1.13.0"
aws-sdk-cloudwatch = "1.144.0"
aws-sdk-costexplorer = "1.141.0"
aws-sdk-dynamodb = "1.139.0"
aws-sdk-ecr = "1.142.0"
aws-sdk-lambda = "1.156.0"
aws-sdk-s3 = "1.157.0"
aws-sdk-sqs = "1.121.0"
forkrail-common = { version = "0.1.0", path = "../common" }
lambda_runtime = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
